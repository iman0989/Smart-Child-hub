<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving this web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value
    of the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Smart Child Daily Activity Tracking System - daily habits, sleep, meals, homework and rewards for children.">
  <meta name="theme-color" content="#4359E0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Smart Child Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Smart Child Hub</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F7F8FE;
      overscroll-behavior: none;
    }

    /*
      Shown while the Flutter engine downloads and boots. Without it, visitors
      see a blank white page for several seconds on a slow connection and often
      assume the link is broken. It is removed as soon as the app mounts.
    */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #191A24;
      text-align: center;
      padding: 24px;
    }

    #loading .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #DDE5FF;
      border-top-color: #4359E0;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    #loading .name {
      font-size: 20px;
      font-weight: 600;
    }

    #loading .hint {
      font-size: 14px;
      color: #43434F;
      max-width: 320px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="name">Smart Child Hub</div>
    <div class="hint">Loading&hellip;</div>
  </div>

  <noscript>
    <div style="padding:24px;font-family:sans-serif;text-align:center">
      Smart Child Hub needs JavaScript enabled to run. Please turn it on in your
      browser settings and reload this page.
    </div>
  </noscript>

  <script>
    // Drop the pre-boot placeholder once the Flutter engine has mounted.
    (function () {
      var placeholder = document.getElementById('loading');
      if (!placeholder) return;
      var observer = new MutationObserver(function () {
        if (!document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) return;
        observer.disconnect();
        placeholder.remove();
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
